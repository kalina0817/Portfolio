<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Kalkidan Debassu</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <style>
      :root {
        --bg: #f5f7f4;
        --panel: #ffffff;
        --text: #112018;
        --muted: #496054;
        --line: #d7e2d9;
        --accent: #1f5a46;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background:
          radial-gradient(circle at 90% 0%, rgba(31, 90, 70, 0.08), transparent 35%),
          radial-gradient(circle at 0% 100%, rgba(67, 90, 160, 0.06), transparent 35%),
          var(--bg);
        color: var(--text);
        padding: 20px;
      }

      main {
        width: min(620px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.4rem, 3vw, 2rem);
      }

      p {
        color: var(--muted);
        margin: 10px 0 0;
      }

      .actions {
        margin-top: 16px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn {
        text-decoration: none;
        border: 1px solid #244a3b;
        border-radius: 10px;
        padding: 9px 12px;
        font-weight: 700;
        color: #1a372c;
        background: #fff;
      }

      .btn.primary {
        background: #244a3b;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page Not Found</h1>
      <p>The page you requested is unavailable or may have moved.</p>
      <div class="actions">
        <a class="btn primary" href="/Portfolio/">Back to Home</a>
        <a class="btn" href="/Portfolio/#projects">View Projects</a>
      </div>
    </main>
  </body>
</html>
